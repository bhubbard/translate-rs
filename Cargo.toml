[package]
name = "translate-rs"
version = "0.1.1"
edition = "2021"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "Deterministic on-device translation CLI and multi-provider HTTP server in Rust (DeepL, LibreTranslate, Google v2 compatible)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bhubbard/translate-rs"
keywords = ["translation", "apple-translation", "deepl", "libretranslate", "cli"]
categories = ["command-line-utilities", "web-programming::http-server", "localization"]

[lib]
name = "translate_rs"
path = "src/lib.rs"

[[bin]]
name = "translate"
path = "src/bin/translate.rs"

[[bin]]
name = "ueb"
path = "src/bin/ueb.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = "2.0"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whatlang = "0.16"
form_urlencoded = "1.2"
serde_urlencoded = "0.7"
async-trait = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
